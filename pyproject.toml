[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-docreview"
version = "0.8.2"
description = "Document comments and tracked changes in your current Codex chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nodejs-wheel-binaries>=24.16,<25"]

[project.scripts]
doc-review = "codex_docreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
